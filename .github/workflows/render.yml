name: render

on:
  workflow_dispatch:
    inputs:
      seconds:
        description: "Clip length in seconds"
        required: false
        default: "3"
      width:
        description: "Width"
        required: false
        default: "720"
      height:
        description: "Height"
        required: false
        default: "1280"
      fps:
        description: "Frames per second"
        required: false
        default: "30"
  push:
    branches: [main]
    paths: ["jobs/**"]

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Pillow
        run: |
          python -m pip install --upgrade pip
          pip install "pillow>=10"

      - name: Install ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -1

      - name: Render
        env:
          SECONDS: ${{ github.event.inputs.seconds || '3' }}
          WIDTH: ${{ github.event.inputs.width || '720' }}
          HEIGHT: ${{ github.event.inputs.height || '1280' }}
          FPS: ${{ github.event.inputs.fps || '30' }}
        run: |
          python render.py \
            --out out/video.mp4 \
            --seconds "$SECONDS" \
            --width "$WIDTH" \
            --height "$HEIGHT" \
            --fps "$FPS"

      - name: Upload MP4
        uses: actions/upload-artifact@v4
        with:
          name: rendered-video
          path: out/video.mp4
          retention-days: 14
